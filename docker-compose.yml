services:
  openresty:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - redis
    networks:
      - ddosnet

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: dpaas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ddosnet

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - ddosnet

networks:
  ddosnet:


volumes:
  pgdata:
