worker_processes 1;

events {
  worker_connections 1024;
}

http {
  lua_shared_dict ip_store 10m;

  resolver 127.0.0.11 valid=5s;

  server {
    listen 8080;

    # ── Gateway Route ─────────────────────────────────────────────────────────
    # Traffic path: /gateway/{apiKey}/{path}
    # NGINX extracts apiKey and endpoint, Lua fetches rate limit config from Redis,
    # then proxies to target origin stored in Redis.
    location ~ ^/gateway/([^/]+)/(.+)$ {
      set $api_key $1;
      set $endpoint_path $2;
      set $target_url "";

      access_by_lua_file /usr/local/openresty/nginx/lua/token_bucket.lua;

      log_by_lua_block {
        local ip = ngx.var.remote_addr
        local status = ngx.status
        local uri = ngx.var.request_uri
        ngx.log(ngx.INFO, "GATEWAY | IP: ", ip, " URI: ", uri, " Status: ", status,
                " apiKey: ", ngx.var.api_key, " path: /", ngx.var.endpoint_path, 
                " target: ", ngx.var.target_url)
      }

      proxy_pass $target_url;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }



    # ── Legacy / Test Route ────────────────────────────────────────────────────
    location / {
      set $api_key "";
      set $endpoint_path "";

      access_by_lua_file /usr/local/openresty/nginx/lua/token_bucket.lua;

      content_by_lua_block {
        local ip = ngx.var.remote_addr
        ngx.say("<Request Allowed>")
        ngx.say("IP: ", ip)
      }

      log_by_lua_block {
        local ip = ngx.var.remote_addr
        local status = ngx.status
        local uri = ngx.var.request_uri
        ngx.log(ngx.INFO, "IP: ", ip, " URI: ", uri, " Status: ", status)
      }
    }
  }
}
